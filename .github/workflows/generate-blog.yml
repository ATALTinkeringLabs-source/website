name: Generate Blog Pages

on:
  push:
    branches:
      - main
    paths:
      - 'posts/**'
      - 'generate-blog.js'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate blog pages
        run: node generate-blog.js

      - name: Commit and push if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add blog.html blog-posts/
            git commit -m "Auto-generate blog pages from Markdown"
            git push
          fi
